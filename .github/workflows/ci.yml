name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: lint
          frozen: true
      - name: Run linters
        run: pixi run --frozen -e lint lint

  tests:
    name: pytest (${{ matrix.environment }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: [py312, py313, py314]
        include:
          # De-encapsulated output contains CRLF by design, so line-ending
          # handling needs at least one Windows runner to be observable.
          - os: windows-latest
            environment: py313
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: ${{ matrix.environment }}
          frozen: true
      - name: Install package
        run: pixi run --frozen -e ${{ matrix.environment }} postinstall
      - name: Run tests
        run: pixi run --frozen -e ${{ matrix.environment }} test-coverage
