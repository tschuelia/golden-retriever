# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
output: [summary]
templates:
  # The lint environment is built with no-default-feature, so every tool has to
  # be invoked in it explicitly -- a bare "pixi run" would resolve in the
  # default environment, which deliberately carries no lint tooling.
  run: run --quiet --no-progress -e lint
no_auto_install: true
pre-commit:
  fail_on_changes: always
  exclude:
    # Test fixtures are byte-exact: whitespace and end-of-file fixers would
    # silently corrupt them, and typos has no business reading RTF payloads.
    - tests/fixtures/**
    - pixi.lock
  jobs:
    - name: pixi-install
      run: pixi install --quiet --no-progress -e lint
    - group:
        parallel: true
        jobs:
          - name: docformatter
            glob: "*.{py,pyi}"
            run: pixi {run} docformatter -i {staged_files}
          - name: ruff-check
            glob: "*.{py,pyi}"
            run: pixi {run} ruff check --fix --exit-non-zero-on-fix --force-exclude
          - name: ruff-format
            glob: "*.{py,pyi}"
            run: pixi {run} ruff format --force-exclude
          - name: mypy
            glob: "*.{py,pyi}"
            run: pixi {run} mypy {staged_files}
          - name: prettier
            glob: "*.{md,yml,yaml}"
            run: pixi {run} prettier --write --no-error-on-unmatched-pattern --list-different --ignore-unknown {staged_files}
            env:
              CI: "1"
          - name: taplo
            glob: "*.toml"
            run: pixi {run} taplo format {staged_files}
          - name: trailing-whitespace-fixer
            glob: "*"
            file_types: text
            run: pixi {run} trailing-whitespace-fixer {staged_files}
          - name: end-of-file-fixer
            glob: "*"
            file_types: text
            run: pixi {run} end-of-file-fixer {staged_files}
          - name: check-merge-conflict
            glob: "*"
            file_types: text
            run: pixi {run} check-merge-conflict --assume-in-merge {staged_files}
          - name: typos
            glob: "*"
            file_types: text
            run: pixi {run} typos --force-exclude {staged_files}
          - name: zizmor
            glob: "*.{yml,yaml}"
            run: pixi {run} zizmor --min-severity high --fix --offline .
