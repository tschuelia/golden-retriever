site_name: otteRTF 🦦
site_description: Extract HTML embedded in RTF according to MS-OXRTFEX
site_url: https://tschuelia.github.io/ottertf/
repo_url: https://github.com/tschuelia/ottertf
repo_name: tschuelia/ottertf
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            heading_level: 2
            members_order: source
            show_root_full_path: false
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Understanding the format:
      - Message files and RTF: message-files.md
      - HTML encapsulation: encapsulation.md
      - Extraction pipeline: extraction.md
      - Encodings and Unicode: encodings.md
  - Using the library:
      - Diagnostics and security: diagnostics-and-security.md
      - API reference: api.md
  - Project:
      - Conformance: conformance.md
      - Development: development.md
