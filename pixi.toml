[workspace]
name = "golden-retriever"
description = "Extract HTML embedded in RTF (MS-OXRTFEX de-encapsulation)."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tasks]
postinstall = "python -m pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."

[dependencies]
python = ">=3.12"
pip = "*"
hatchling = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.test.tasks]
test = "pytest"
test-slow = "pytest -m slow"
test-coverage = "pytest --cov=golden_retriever --cov-report=term-missing"

[feature.lint.dependencies]
lefthook = "*"
# 1.7.8 deletes one of the two blank lines between an attribute docstring that
# ends a class body and a following decorated statement, which ruff format then
# puts back -- the two tools rewrite the same line forever and the hook fails on
# a coin flip. 1.7.7 leaves it alone. Reproduce with a three-line file:
#   class A:\n    x = 1\n    """Doc."""\n\n\n@dec\nclass B:\n    """Doc."""
docformatter = "!=1.7.8"
ruff = "*"
mypy = "*"
# mypy type-checks the test suite too, so it needs pytest importable to resolve
# the decorators it uses. Not a package dependency: the lint environment is
# built with no-default-feature.
pytest = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"
# Fast escape hatches for running a single tool.
ruff-check = "ruff check golden_retriever tests"
format = "ruff format golden_retriever tests"
format-check = "ruff format --check golden_retriever tests"
typecheck = "mypy golden_retriever tests"

[feature.docs.dependencies]
python = ">=3.12"
mkdocs-material = "9.*"
mkdocstrings-python = "1.*"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
