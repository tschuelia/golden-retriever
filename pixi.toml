[workspace]
name = "golden-retriever"
description = "Extract HTML embedded in RTF (MS-OXRTFEX de-encapsulation)."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tasks]
postinstall = "python -m pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."

[dependencies]
python = ">=3.12"
pip = "*"
hatchling = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.test.tasks]
test = "pytest"
test-slow = "pytest -m slow"
test-coverage = "pytest --cov=golden_retriever --cov-report=term-missing"

[feature.lint.dependencies]
lefthook = "*"
docformatter = "*"
ruff = "*"
mypy = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"

[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"
# Fast escape hatches for running a single tool.
ruff-check = "ruff check golden_retriever tests"
format = "ruff format golden_retriever tests"
format-check = "ruff format --check golden_retriever tests"
typecheck = "mypy golden_retriever tests"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
lint = { features = ["lint"], no-default-feature = true }
